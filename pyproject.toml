[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "acoa"
version = "0.1.0"
description = "Single-user autonomous career opportunity agent: safe repository bootstrap."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
acoa-application-usage = "acoa.interfaces.application_usage_cli:main"

[project.optional-dependencies]
dev = [
    "mypy==1.18.2",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/acoa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
    "bootstrap: EP-00.01; K-01; E-09.01; E-10.03; ADR-001; no live actions.",
    "configuration: EP-00.02; E-02.01; E-07.03; P-04/P-10/P-17; ADR-006/011.",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/acoa", "tests"]
strict = true
